site_name: PapeRanger
site_description: A self-hosted home for your household's paperwork.
site_url: https://www.gustavofurtado.com/PapeRanger/
repo_url: https://github.com/GusFurtado/PapeRanger
repo_name: GusFurtado/PapeRanger
edit_uri: edit/main/docs/

extra_css:
  - assets/extra.css

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: light green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest

nav:
  - Home: index.md
  - Installation: installation.md
  - Your documents on disk: storage.md
  - Encryption: encryption.md
  - Security: security.md
  - Development: development.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
